name: Build Native AOT

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: fairflip-linux-x64
          - os: windows-latest
            rid: win-x64
            artifact: fairflip-win-x64
          - os: macos-latest
            rid: osx-x64
            artifact: fairflip-macos-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: fairflip-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish Native AOT
        run: dotnet publish -c Release -r ${{ matrix.rid }} -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/
          if-no-files-found: error
