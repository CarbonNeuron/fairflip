name: Build Native AOT and .NET Tool

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: fairflip-linux-x64
          - os: windows-latest
            rid: win-x64
            artifact: fairflip-win-x64
          - os: macos-latest
            rid: osx-x64
            artifact: fairflip-macos-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: fairflip-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Native AOT
        run: dotnet publish -c Release -r ${{ matrix.rid }} -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: publish/
          if-no-files-found: error

  tool:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pack .NET tool
        shell: bash
        run: |
          pack_args=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            pack_args+=("-p:Version=${GITHUB_REF_NAME#v}")
          fi
          dotnet pack fairflip.csproj -c Release -o nupkg "${pack_args[@]}"

      - name: Install and run tool from package
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/local-nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$GITHUB_WORKSPACE/nupkg" />
            </packageSources>
          </configuration>
          EOF
          dotnet tool install fairflip --tool-path "$RUNNER_TEMP/fairflip-tool" --configfile "$RUNNER_TEMP/local-nuget.config"
          "$RUNNER_TEMP/fairflip-tool/fairflip" --list
          "$RUNNER_TEMP/fairflip-tool/fairflip" 1

      - name: Upload .NET tool package
        uses: actions/upload-artifact@v7
        with:
          name: fairflip-tool-nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  publish-tool:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tool]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download .NET tool package
        uses: actions/download-artifact@v8
        with:
          name: fairflip-tool-nupkg
          path: nupkg

      - name: Log in to NuGet.org
        id: login
        uses: NuGet/login@v1
        with:
          user: CarbonNeuron

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
